aid: rye
name: Rye
description: >-
  Rye is agentic commerce infrastructure - a Universal Checkout API that turns any
  product URL into a completed order without redirecting the shopper. Developers pass
  a product URL and buyer details and receive price, tax, shipping and delivery
  estimates, then confirm with a tokenized payment method (Stripe, Basis Theory,
  pre-funded drawdown balance, or x402/USDC) to place the order across thousands of
  merchants including Shopify stores and Amazon. Rye combines AI browser automation
  with fraud-mitigation and caches successful flows as deterministic workflows,
  advertising 90%+ order reliability, sub-35s offer resolution, and 99.9% uptime. The
  platform ships official TypeScript, Python, and Java SDKs, HMAC-signed webhooks, a
  staging sandbox with test products and simulated shipment/return helpers, Rewards UI
  React components, and a returns/refunds lifecycle. Rye is an a16z portfolio company.
