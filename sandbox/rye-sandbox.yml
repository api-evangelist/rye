generated: '2026-07-21'
method: searched
source: https://rye.com/docs/api-v2/environments
description: >-
  Rye's sandbox / test-data surface. The staging environment acts as a sandbox:
  no real orders are placed through /confirm and payments use Stripe test cards.
  Staging and production are completely isolated and use separate API keys. Rye
  publishes a dedicated Shopify test store plus edge-case test products and
  simulated-shipment / simulated-return test helpers to exercise the full order
  lifecycle. Values below are published verbatim by Rye.
docs:
  - https://rye.com/docs/api-v2/environments
  - https://rye.com/docs/api-v2/testing/test-products
  - https://rye.com/docs/api-v2/testing/with-shopify
modes:
  - name: staging
    base_url: https://staging.api.rye.com/api/v1/
    console: https://staging.console.rye.com
    notes: Sandbox. No real orders placed via /confirm; Stripe test cards only; isolated from production.
  - name: production
    base_url: https://api.rye.com/api/v1/
    console: https://console.rye.com
test_payments:
  provider: Stripe (test mode)
  test_cards: https://docs.stripe.com/testing
