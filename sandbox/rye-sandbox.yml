test_helpers:
  description: Staging-only endpoints to drive simulated shipment and return lifecycles.
  operations:
    - AdvanceShipment (POST /api/v1/test-helpers/checkout-intents/{checkoutIntentId}/shipments/advance)
    - CreateSimulatedReturn (POST /api/v1/test-helpers/returns)
    - ApproveReturn (POST /api/v1/test-helpers/returns/{returnId}/approve)
    - DenyReturn (POST /api/v1/test-helpers/returns/{returnId}/deny)
    - RefundReturn (POST /api/v1/test-helpers/returns/{returnId}/refund)
    - FailReturn (POST /api/v1/test-helpers/returns/{returnId}/fail)
