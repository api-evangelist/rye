  note: Publishable (non-secret) key published by Rye docs to tokenize test cards in staging.
test_stores:
  - url: rye-test-store.myshopify.com
    notes: Hosts all documented test products; use with Stripe test cards.
  - url: rye-protocol.myshopify.com
    notes: Production test store on a live payment gateway - payments are not captured; funds auto-returned after ~1 week.
test_products:
