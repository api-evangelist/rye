openapi: 3.0.0
components:
  examples: {}
  headers: {}
  parameters: {}
  requestBodies: {}
  responses: {}
  schemas:
    Money:
      properties:
        currencyCode:
          type: string
          example: USD
        amountSubunits:
          type: integer
          format: int32
          example: 1500
      required:
        - currencyCode
        - amountSubunits
      type: object
    BalanceResponse:
      properties:
        drawdownEnabled:
          type: boolean
        balance:
          $ref: '#/components/schemas/Money'
      required:
        - drawdownEnabled
        - balance
      type: object
    AuthenticationError:
      properties:
        name:
          type: string
        message:
          type: string
        stack:
          type: string
      required:
        - name
        - message
      type: object
      additionalProperties: false
    FieldErrors:
      properties: {}
      type: object
      additionalProperties:
        properties:
          value: {}
          message:
            type: string
        required:
          - message
        type: object
    ValidateError:
      properties:
        name:
          type: string
        message:
          type: string
        stack:
          type: string
        status:
          type: number
          format: double
        fields:
          $ref: '#/components/schemas/FieldErrors'
      required:
        - name
        - message
        - status
        - fields
      type: object
      additionalProperties: false
    BillingResponse:
      properties:
        drawdown:
          properties:
            balance:
              allOf:
                - $ref: '#/components/schemas/Money'
              nullable: true
            config:
              properties:
                chargeAutomatically:
                  type: boolean
                currency:
                  type: string
                  example: USD
                minBalanceSubunits:
                  type: number
                  format: double
                  example: 200000
                targetBalanceSubunits:
                  type: number
                  format: double
                  example: 1000000
              required:
                - chargeAutomatically
                - currency
                - minBalanceSubunits
                - targetBalanceSubunits
              type: object
              nullable: true
            enabled:
              type: boolean
          required:
            - balance
            - config
            - enabled
          type: object
      required:
        - drawdown
      type: object
    SetupDrawdownParams:
      properties:
        chargeAutomatically:
          type: boolean
          description: |-
            Whether to automatically charge the invoice when created.
            Defaults to true if not specified.
          example: true
        minBalanceSubunits:
          type: integer
          format: int32
          description: |-
            Minimum balance threshold in smallest currency unit (e.g. cents).
            A top-up is triggered when balance falls below this value.
          example: 200000
          minimum: 10
        targetBalanceSubunits:
          type: integer
          format: int32
          description: |-
            Target balance in smallest currency unit (e.g. cents). When balance
            drops below minBalanceSubunits, a top-up invoice is created to
            replenish to this amount.
          example: 1000000
          minimum: 100
      required:
        - minBalanceSubunits
        - targetBalanceSubunits
      type: object
    InvoiceStatus:
      type: string
      enum:
        - draft
        - open
        - paid
        - uncollectible
        - void
        - unknown
    BankTransferDetails:
      description: Vendor-agnostic bank transfer details for push-based payment
      properties:
        routingNumber:
          type: string
        accountNumber:
          type: string
        bankName:
          type: string
        accountHolderName:
          type: string
      required:
        - routingNumber
        - accountNumber
        - bankName
        - accountHolderName
      type: object
      additionalProperties: false
    Invoice:
      properties:
        bankTransferDetails:
          $ref: '#/components/schemas/BankTransferDetails'
        url:
          type: string
          nullable: true
          example: https://invoice.stripe.com/i/acct_xxx/test_xxx
        amount:
          $ref: '#/components/schemas/Money'
        status:
          $ref: '#/components/schemas/InvoiceStatus'
        id:
          type: string
          example: in_abc123
      required:
        - bankTransferDetails
        - url
        - amount
        - status
        - id
      type: object
    CreateTopUpParams:
      properties:
        chargeAutomatically:
          type: boolean
          description: |-
            Override whether to automatically charge the invoice.
            Defaults to the developer's drawdown config value if not specified.
          example: false
        amountSubunits:
          type: integer
          format: int32
          description: Amount in smallest currency unit (e.g. cents).
          example: 500000
          minimum: 1
      required:
        - amountSubunits
      type: object
    Pick_Invoice.Exclude_keyofInvoice.amount-or-bankTransferDetails__:
      properties:
        id:
          type: string
          example: in_abc123
        status:
          $ref: '#/components/schemas/InvoiceStatus'
        url:
          type: string
          example: https://invoice.stripe.com/i/acct_xxx/test_xxx
      required:
        - id
        - status
        - url
      type: object
      description: From T, pick a set of properties whose keys are in the union K
    Omit_Invoice.amount-or-bankTransferDetails_:
      $ref: >-
        #/components/schemas/Pick_Invoice.Exclude_keyofInvoice.amount-or-bankTransferDetails__
      description: Construct a type with the properties of T except for those in type K.
    DuplicateInvoice:
      allOf:
        - $ref: '#/components/schemas/Omit_Invoice.amount-or-bankTransferDetails_'
        - properties:
            bankTransferDetails:
              allOf:
                - $ref: '#/components/schemas/BankTransferDetails'
              nullable: true
            amount:
              allOf:
                - $ref: '#/components/schemas/Money'
              nullable: true
          required:
            - bankTransferDetails
            - amount
          type: object
      description: >-
        Degraded invoice returned when full details are unavailable (e.g. Stripe
        fetch failed)
    Record_string.string_:
      properties: {}
      additionalProperties:
        type: string
      type: object
      description: Construct a type with a set of properties K of type T
    TransactionResponse:
      properties:
        createdAt:
          type: string
          format: date-time
        metadata:
          $ref: '#/components/schemas/Record_string.string_'
        description:
          type: string
          example: 'Balance debit for order #12345'
        amount:
          $ref: '#/components/schemas/Money'
        id:
          type: string
          example: cbtxn_abc123
      required:
        - createdAt
        - amount
        - id
      type: object
    TransactionsResponse:
      properties:
        pageInfo:
          properties:
            startCursor:
              type: string
              example: cbtxn_abc123
            endCursor:
              type: string
              example: cbtxn_xyz789
            hasPreviousPage:
              type: boolean
            hasNextPage:
              type: boolean
          required:
            - hasPreviousPage
            - hasNextPage
          type: object
        data:
          items:
            $ref: '#/components/schemas/TransactionResponse'
          type: array
      required:
        - pageInfo
        - data
      type: object
    Marketplace:
      enum:
        - AMAZON
        - SHOPIFY
        - BESTBUY
        - SEPHORA
        - UNKNOWN
      type: string
    Brand:
      properties:
        supported:
          type: boolean
          description: >-
            If `false`, then products from this brand cannot be purchased
            through the

            Sell Anything API.
        marketplace:
          $ref: '#/components/schemas/Marketplace'
          description: Indicates what ecommerce platform the brand uses.
        id:
          type: string
          description: A unique identifier for the brand.
      required:
        - supported
        - marketplace
        - id
      type: object
    NotFoundError:
      properties:
        name:
          type: string
        message:
          type: string
        stack:
          type: string
      required:
        - name
        - message
      type: object
      additionalProperties: false
    RuntimeError:
      properties:
        name:
          type: string
        message:
          type: string
        stack:
          type: string
      required:
        - name
        - message
      type: object
      additionalProperties: false
    Domain:
      type: string
      example: shop.aloyoga.com
      format: hostname
      description: Represents a valid domain name string.
      pattern: ^(?=.{1,253}$)(?!\-)([a-zA-Z0-9\-]{1,63}(?<!\-)\.)+[a-zA-Z]{2,63}$
    Buyer:
      properties:
        postalCode:
          type: string
          example: '10001'
          maxLength: 255
        country:
          type: string
          example: US
        province:
          type: string
          example: NY
          maxLength: 255
        city:
          type: string
          example: New York
          maxLength: 255
        address2:
          type: string
          example: Apt 1
          maxLength: 255
        address1:
          type: string
          example: 123 Main St
          maxLength: 255
        phone:
          type: string
          example: '1234567890'
        email:
          type: string
          example: john.doe@example.com
        lastName:
          type: string
          example: Doe
          maxLength: 255
        firstName:
          type: string
          example: John
          maxLength: 255
      required:
        - postalCode
        - country
        - province
        - city
        - address1
        - phone
        - email
        - lastName
        - firstName
      type: object
    StripeTokenPaymentMethod:
      properties:
        stripeToken:
          type: string
          example: tok_1RkrWWHGDlstla3f1Fc7ZrhH
        type:
          type: string
          enum:
            - stripe_token
          nullable: false
          example: stripe_token
      required:
        - stripeToken
        - type
      type: object
      title: Stripe
    BasisTheoryPaymentMethod:
      properties:
        basisTheoryToken:
          type: string
        type:
          type: string
          enum:
            - basis_theory_token
          nullable: false
      required:
        - basisTheoryToken
        - type
      type: object
      title: Basis Theory
    DrawdownPaymentMethod:
      properties:
        type:
          type: string
          enum:
            - drawdown
          nullable: false
      required:
        - type
      type: object
      title: Drawdown
    X402PaymentMethod:
      properties:
        network:
          type: string
          enum:
            - base
            - solana
            - tempo
        type:
          type: string
          enum:
            - x402
          nullable: false
      required:
        - network
        - type
      type: object
      title: X402
    PaymentMethod:
      anyOf:
        - $ref: '#/components/schemas/StripeTokenPaymentMethod'
        - $ref: '#/components/schemas/BasisTheoryPaymentMethod'
        - $ref: '#/components/schemas/DrawdownPaymentMethod'
        - $ref: '#/components/schemas/X402PaymentMethod'
    InvalidCheckoutIntentStateError:
      properties:
        name:
          type: string
        message:
          type: string
        stack:
          type: string
        state:
          type: string
      required:
        - name
        - message
      type: object
      additionalProperties: false
    Partial_Buyer_:
      properties:
        firstName:
          type: string
          example: John
          maxLength: 255
        lastName:
          type: string
          example: Doe
          maxLength: 255
        email:
          type: string
          example: john.doe@example.com
        phone:
          type: string
          example: '1234567890'
        address1:
          type: string
          example: 123 Main St
          maxLength: 255
        address2:
          type: string
          example: Apt 1
          maxLength: 255
        city:
          type: string
          example: New York
          maxLength: 255
        province:
          type: string
          example: NY
          maxLength: 255
        country:
          type: string
          example: US
        postalCode:
          type: string
          example: '10001'
          maxLength: 255
      type: object
      description: Make all properties in T optional
    VariantSelection:
      properties:
        value:
          anyOf:
            - type: string
            - type: number
              format: double
          example: Small, Red, XS, L, etc.
          maxLength: 60
        label:
          type: string
          example: Size, Color, etc.
          maxLength: 30
      required:
        - value
        - label
      type: object
    FailureReasonCode:
      type: string
      enum:
        - unknown
        - checkout_intent_expired
        - payment_failed
        - payment_cvc_expired
        - insufficient_stock
        - product_out_of_stock
        - offer_retrieval_failed
        - order_placement_failed
        - developer_not_found
        - missing_shipping_method
        - unsupported_currency
        - invalid_input
        - incorrect_cost_breakdown
        - unsupported_store_no_guest_checkout
        - workflow_invocation_failed
        - variant_selections_invalid
        - variant_selections_required
        - form_validation_error
        - captcha_blocked
        - bot_protection_blocked
        - constraint_total_price_exceeded
        - constraint_shipping_cost_exceeded
        - promo_code_discovery_not_enabled
        - product_not_found
      description: Type derived from runtime array - always in sync
    PromoCode:
      type: string
      example: SAVE20
      description: |-
        Promo code string with validation constraints.
        - Must contain only letters, digits, underscores, or hyphens
        - Maximum length of 32 characters
      pattern: ^[a-zA-Z0-9_\-]+$
      maxLength: 32
    OfferRetrievalEffort:
      type: string
      enum:
        - max
        - low
      description: >-
        Controls how much effort the system should spend retrieving an offer.

        - 'max': Full effort including AI agent fallback (slower, higher success
        rate)

        - 'low': Fast API-only retrieval, fails if API unavailable (faster,
        lower success rate)


        Default: 'max'
    CheckoutConstraints:
      properties:
        offerRetrievalEffort:
          $ref: '#/components/schemas/OfferRetrievalEffort'
          example: max
        maxShippingPrice:
          type: integer
          format: int32
          example: 500
          minimum: 0
        maxTotalPrice:
          type: integer
          format: int32
          example: 100000
          minimum: 0
      type: object
    BaseCheckoutIntent:
      properties:
        referenceId:
          type: string
          example: order-1234
          maxLength: 255
        discoverPromoCodes:
          type: boolean
        constraints:
          $ref: '#/components/schemas/CheckoutConstraints'
        promoCodes:
          items:
            $ref: '#/components/schemas/PromoCode'
          type: array
        variantSelections:
          items:
            $ref: '#/components/schemas/VariantSelection'
          type: array
        buyer:
          $ref: '#/components/schemas/Buyer'
        quantity:
          type: integer
          format: int32
          minimum: 0
        productUrl:
          type: string
        createdAt:
          type: string
          format: date-time
        id:
          type: string
      required:
        - buyer
        - quantity
        - productUrl
        - createdAt
        - id
      type: object
    RetrievingOfferCheckoutIntent:
      allOf:
        - $ref: '#/components/schemas/BaseCheckoutIntent'
        - properties:
            state:
              type: string
              enum:
                - retrieving_offer
              nullable: false
          required:
            - state
          type: object
      title: Retrieving Offer
    Cost:
      properties:
        total:
          $ref: '#/components/schemas/Money'
        surcharge:
          $ref: '#/components/schemas/Money'
        discount:
          $ref: '#/components/schemas/Money'
        tax:
          $ref: '#/components/schemas/Money'
        shipping:
          $ref: '#/components/schemas/Money'
        subtotal:
          $ref: '#/components/schemas/Money'
      required:
        - total
        - subtotal
      type: object
    DeliveryEstimate:
      properties:
        latest:
          type: string
          format: date-time
          description: Latest date that items will be delivered by.
          example: '2026-03-28T00:00:00Z'
        earliest:
          type: string
          format: date-time
          description: Earliest date that items will be delivered by.
          example: '2026-03-25T00:00:00Z'
      type: object
      description: >-
        Estimated range of dates that items will be delivered in. At least one
        of

        `earliest` or `latest` are guaranteed to be set.


        Interpretation:


        * If both `earliest` and `latest` are set, then the delivery estimate is
        the range between the two dates.

        * If only `earliest` is set, then the delivery estimate is any date
        after that date.

        * If only `latest` is set, then the delivery estimate is any date before
        that date.
    ShippingOption:
      properties:
        deliveryEstimate:
          allOf:
            - $ref: '#/components/schemas/DeliveryEstimate'
          nullable: true
        discount:
          $ref: '#/components/schemas/Money'
        cost:
          $ref: '#/components/schemas/Money'
        id:
          type: string
      required:
        - cost
        - id
      type: object
    Shipping:
      properties:
        availableOptions:
          items:
            $ref: '#/components/schemas/ShippingOption'
          type: array
        selectedOptionId:
          type: string
      required:
        - availableOptions
      type: object
    CommissionPotential:
      properties:
        estimate:
          type: boolean
        amount:
          $ref: '#/components/schemas/Money'
      required:
        - estimate
        - amount
      type: object
      description: The commission a developer would earn if this offer is placed.
    Offer:
      properties:
        commission:
          $ref: '#/components/schemas/CommissionPotential'
        shipping:
          $ref: '#/components/schemas/Shipping'
        cost:
          $ref: '#/components/schemas/Cost'
        appliedPromoCodes:
          items:
            type: string
          type: array
      required:
        - shipping
        - cost
      type: object
    AwaitingConfirmationCheckoutIntent:
      allOf:
        - $ref: '#/components/schemas/BaseCheckoutIntent'
        - properties:
            paymentMethod:
              $ref: '#/components/schemas/PaymentMethod'
            offer:
              $ref: '#/components/schemas/Offer'
            state:
              type: string
              enum:
                - awaiting_confirmation
              nullable: false
          required:
            - offer
            - state
          type: object
      title: Awaiting Confirmation
    X402NextAction:
      properties:
        x402:
          properties:
            expiresAt:
              type: string
            recipient:
              type: string
            currency:
              type: string
              enum:
                - USDC
              nullable: false
            maxAmountRequired:
              type: string
            network:
              type: string
            scheme:
              type: string
              enum:
                - exact
              nullable: false
          required:
            - expiresAt
            - recipient
            - currency
            - maxAmountRequired
            - network
            - scheme
          type: object
        type:
          type: string
          enum:
            - x402
          nullable: false
      required:
        - x402
        - type
      type: object
    NextAction:
      $ref: '#/components/schemas/X402NextAction'
    RequiresActionCheckoutIntent:
      allOf:
        - $ref: '#/components/schemas/BaseCheckoutIntent'
        - properties:
            nextAction:
              $ref: '#/components/schemas/NextAction'
            paymentMethod:
              $ref: '#/components/schemas/PaymentMethod'
            offer:
              $ref: '#/components/schemas/Offer'
            state:
              type: string
              enum:
                - requires_action
              nullable: false
          required:
            - nextAction
            - paymentMethod
            - offer
            - state
          type: object
      title: Requires Action
    PlacingOrderCheckoutIntent:
      allOf:
        - $ref: '#/components/schemas/BaseCheckoutIntent'
        - properties:
            paymentMethod:
              $ref: '#/components/schemas/PaymentMethod'
            offer:
              $ref: '#/components/schemas/Offer'
            state:
              type: string
              enum:
                - placing_order
              nullable: false
          required:
            - paymentMethod
            - offer
            - state
          type: object
      title: Placing Order
    CompletedCheckoutIntent:
      allOf:
        - $ref: '#/components/schemas/BaseCheckoutIntent'
        - properties:
            estimatedDeliveryDate:
              type: string
              format: date-time
              nullable: true
              deprecated: true
            orderId:
              type: string
              nullable: true
            paymentMethod:
              $ref: '#/components/schemas/PaymentMethod'
            offer:
              $ref: '#/components/schemas/Offer'
            state:
              type: string
              enum:
                - completed
              nullable: false
          required:
            - orderId
            - paymentMethod
            - offer
            - state
          type: object
      title: Completed
    FailureReason:
      properties:
        message:
          type: string
        code:
          $ref: '#/components/schemas/FailureReasonCode'
      required:
        - message
        - code
      type: object
    FailedCheckoutIntent:
      allOf:
        - $ref: '#/components/schemas/BaseCheckoutIntent'
        - properties:
            failureReason:
              $ref: '#/components/schemas/FailureReason'
            paymentMethod:
              $ref: '#/components/schemas/PaymentMethod'
            offer:
              $ref: '#/components/schemas/Offer'
            state:
              type: string
              enum:
                - failed
              nullable: false
          required:
            - failureReason
            - state
          type: object
      title: Failed
    CheckoutIntent:
      anyOf:
        - $ref: '#/components/schemas/RetrievingOfferCheckoutIntent'
        - $ref: '#/components/schemas/AwaitingConfirmationCheckoutIntent'
        - $ref: '#/components/schemas/RequiresActionCheckoutIntent'
        - $ref: '#/components/schemas/PlacingOrderCheckoutIntent'
        - $ref: '#/components/schemas/CompletedCheckoutIntent'
        - $ref: '#/components/schemas/FailedCheckoutIntent'
    CheckoutIntentListResponse:
      properties:
        pageInfo:
          properties:
            endCursor:
              type: string
            startCursor:
              type: string
            hasPreviousPage:
              type: boolean
            hasNextPage:
              type: boolean
          required:
            - hasPreviousPage
            - hasNextPage
          type: object
        data:
          items:
            $ref: '#/components/schemas/CheckoutIntent'
          type: array
      required:
        - pageInfo
        - data
      type: object
    CheckoutIntentState:
      type: string
      enum:
        - completed
        - failed
        - retrieving_offer
        - awaiting_confirmation
        - requires_action
        - placing_order
    CancellationReasonCode:
      type: string
      enum:
        - requested_by_customer
        - fraud
        - inventory
        - payment_issue
        - staff_error
        - other
    CancellationReason:
      properties:
        message:
          type: string
          description: >-
            Optional free-text note explaining the cancellation, forwarded to
            the

            merchant when possible.
          maxLength: 256
        code:
          $ref: '#/components/schemas/CancellationReasonCode'
      required:
        - code
      type: object
    BaseCancellation:
      properties:
        reason:
          $ref: '#/components/schemas/CancellationReason'
        marketplaceOrderId:
          type: string
        checkoutIntentId:
          type: string
        createdAt:
          type: string
          format: date-time
        id:
          type: string
      required:
        - reason
        - marketplaceOrderId
        - checkoutIntentId
        - createdAt
        - id
      type: object
    RequestedCancellation:
      allOf:
        - $ref: '#/components/schemas/BaseCancellation'
        - properties:
            state:
              type: string
              enum:
                - requested
              nullable: false
          required:
            - state
          type: object
    CompletedCancellation:
      allOf:
        - $ref: '#/components/schemas/BaseCancellation'
        - properties:
            state:
              type: string
              enum:
                - completed
              nullable: false
          required:
            - state
          type: object
    CancellationDenialReasonCode:
      type: string
      enum:
        - other
        - already_shipped
        - non_cancellable_item
        - cancellation_window_expired
    CancellationDenialReason:
      properties:
        code:
          $ref: '#/components/schemas/CancellationDenialReasonCode'
        message:
          type: string
      required:
        - code
        - message
      type: object
    DeniedCancellation:
      allOf:
        - $ref: '#/components/schemas/BaseCancellation'
        - properties:
            denialReason:
              $ref: '#/components/schemas/CancellationDenialReason'
            state:
              type: string
              enum:
                - denied
              nullable: false
          required:
            - denialReason
            - state
          type: object
    Cancellation:
      anyOf:
        - $ref: '#/components/schemas/RequestedCancellation'
        - $ref: '#/components/schemas/CompletedCancellation'
        - $ref: '#/components/schemas/DeniedCancellation'
    OrderResponse:
      description: >-
        Represents a completed order. Orders are created after a checkout intent
        reaches

        the `completed` state.
      properties:
        id:
          type: string
        checkoutIntentId:
          type: string
          description: >-
            ID of the checkout intent that was responsible for creating this
            order.
          example: ci_aaa8af5c5aae4c0e8ef0172c26c65c13
        createdAt:
          type: string
          description: Timestamp the order was persisted to Rye.
          example: '2026-03-25T00:00:00Z'
        updatedAt:
          type: string
          description: Timestamp the order was last updated at
          example: '2026-03-27T00:00:00Z'
        referenceId:
          type: string
          description: >-
