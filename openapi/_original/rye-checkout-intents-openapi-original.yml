          enum:
            - store
          nullable: false
          description: Scope of the subscription change.
        domain:
          type: string
          description: Store domain.
        url:
          type: string
          description: Store subscription URL.
        subscribed:
          type: boolean
          description: Whether the resolved store is subscribed after the mutation.
      required:
        - type
        - domain
        - url
        - subscribed
      type: object
      additionalProperties: false
    ProductSubscriptionResponse:
      anyOf:
        - $ref: '#/components/schemas/ProductSubscriptionProductResponse'
        - $ref: '#/components/schemas/ProductSubscriptionStoreResponse'
    ListProductSubscriptionsResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/ProductSubscriptionResponse'
          type: array
      required:
        - data
      type: object
    TooManyRequestsError:
      properties:
        name:
          type: string
        message:
          type: string
        stack:
          type: string
        retryAfter:
          type: string
      required:
        - name
        - message
      type: object
      additionalProperties: false
    ProductSubscriptionTargetType:
      type: string
      enum:
        - store
        - product
    ProductSubscriptionRequest:
      properties:
        url:
          type: string
          description: Store or product URL to subscribe or unsubscribe.
          example: https://store.com
        type:
          $ref: '#/components/schemas/ProductSubscriptionTargetType'
          description: Scope of the subscription change.
      required:
        - url
        - type
      type: object
    ReturnState:
      type: string
      enum:
        - requested
        - requires_action
        - processing
        - refunded
        - denied
        - failed
      description: |-
        Lifecycle state of a Return:

        - `requested` — submitted to the merchant, awaiting approval.
        - `requires_action` — approved; the shopper must ship the items back.
        - `processing` — approved and in flight (items shipped, or no shipping
          required), awaiting the refund.
        - `refunded` — terminal; the refund has been issued and reconciled.
        - `denied` — terminal; the merchant declined the return.
        - `failed` — terminal; the return could not be completed.
    ReturnReason:
      type: string
      enum:
        - defective
        - wrong_item
        - unwanted
        - color
        - not_as_described
        - size_too_large
        - size_too_small
        - style
        - other
      description: >-
        Reason a shopper is returning an order, supplied on the create-return
        call:

        `defective` (arrived damaged or faulty), `wrong_item` (not what was
        ordered),

        `unwanted` (changed their mind), `color` / `size_too_large` /

        `size_too_small` / `style` (wrong color, size, or style),
        `not_as_described`

        (differs from the listing), and `other` (anything else).
    ReturnTimeline:
      properties:
        failedAt:
          type: string
          format: date-time
          description: When the return failed. Present only on `failed`.
        deniedAt:
          type: string
          format: date-time
          description: When the return was denied. Present only on `denied`.
        refundedAt:
          type: string
          format: date-time
          description: >-
            When the refund was fully reconciled and the Return reached
            `refunded`.
        refundIssuedAt:
          type: string
          format: date-time
          description: When the merchant issued the refund on its side.
        returnApprovedAt:
          type: string
          format: date-time
          description: When the merchant approved the return.
        requestedAt:
          type: string
          format: date-time
          description: When the return was requested. Always present.
      required:
        - requestedAt
      type: object
      description: >-
        Per-transition timestamps for a Return. `requestedAt` is always set; the
        rest

        fill in as the Return advances and reflect the path it actually took (a

        `denied` Return has `deniedAt` but never `refundedAt`).
    NextActionType:
      type: string
      enum:
        - ship_items_to_merchant
        - no_action_required
      description: >-
        Discriminator for {@link NextActionResponse }: `ship_items_to_merchant`
        (the

        shopper must return the items with the provided label) or

        `no_action_required` (a keep-the-item / no-ship approval — the shopper
        just

        waits for the refund).
    ShippingLabel:
      properties:
        url:
          type: string
          description: URL to the downloadable/printable label.
      required:
        - url
      type: object
      description: A prepaid return shipping label the shopper uses to send items back.
    NextActionResponse:
      properties:
        shipItemsToMerchant:
          properties:
            label:
              $ref: '#/components/schemas/ShippingLabel'
          required:
            - label
          type: object
          description: >-
            Prepaid return label. Present only when `type` is
            `ship_items_to_merchant`.
        type:
          $ref: '#/components/schemas/NextActionType'
          description: Discriminator for the action the shopper must take.
      required:
        - type
      type: object
      description: >-
        What the shopper has to do next to complete the return. Present once the

        Return is approved.


        `type` is the discriminator: `ship_items_to_merchant` carries the
        matching

        `shipItemsToMerchant` payload (a prepaid label); `no_action_required`
        means

        the merchant approved a keep-the-item / no-ship return and the shopper
        just

        waits for the refund (no payload). The `requires_action` state is
        reached

        only for `ship_items_to_merchant`; a `no_action_required` approval skips

        straight to `processing`.
    ReturnDeclineReason:
      type: string
      enum:
        - final_sale
        - return_period_ended
        - other
      description: |-
        Why a merchant declined a return:

        - `final_sale` — the item was sold as final sale and is not returnable.
        - `return_period_ended` — the return window had already closed.
        - `other` — declined for another reason; see the accompanying note.
    ReturnDenialResponse:
      properties:
        note:
          type: string
          description: Optional human-readable detail from the merchant.
        reason:
          $ref: '#/components/schemas/ReturnDeclineReason'
          description: Machine-readable decline reason.
      required:
        - reason
      type: object
      description: Why a return was declined by the merchant.
    ReturnFailureCode:
      type: string
      enum:
        - drawdown_credit_failed
        - merchant_unreachable
        - other
      description: >-
        Discriminator for the `failure` sub-object on a `failed` Return:


        - `drawdown_credit_failed` — the merchant refund succeeded but Rye could
        not
          credit it back; the refund still reached the shopper.
        - `merchant_unreachable` — the marketplace did not respond before the
          processing deadline.
        - `other` — an uncategorized failure; see `message` for detail.


        Switch on this exhaustively to handle every failure mode.
    ReturnFailureResponse:
      properties:
        message:
          type: string
          description: Human-readable, stable summary of the failure.
        code:
          $ref: '#/components/schemas/ReturnFailureCode'
          description: Machine-readable failure code; switch on this.
      required:
        - message
        - code
      type: object
      description: Details of a failed return.
    RefundResponse:
      properties:
        shopperRefundTotal:
          $ref: '#/components/schemas/Money'
          description: >-
            Amount returned to the shopper, in the shopper's presentment
            currency.
        refundedAt:
          type: string
          format: date-time
          description: When this refund was reconciled.
        id:
          type: string
          description: Rye refund id.
      required:
        - shopperRefundTotal
        - refundedAt
        - id
      type: object
      description: A single refund issued against a `refunded` Return.
    ReturnResponse:
      properties:
        updatedAt:
          type: string
          format: date-time
          description: When the Return record was last updated.
        createdAt:
          type: string
          format: date-time
          description: When the Return record was created.
        refunds:
          items:
            $ref: '#/components/schemas/RefundResponse'
          type: array
          description: Issued refunds. Present only on `refunded`.
        failure:
          $ref: '#/components/schemas/ReturnFailureResponse'
          description: What went wrong. Present only on `failed`.
        denial:
          $ref: '#/components/schemas/ReturnDenialResponse'
          description: Why the merchant declined the return. Present only on `denied`.
        nextAction:
          $ref: '#/components/schemas/NextActionResponse'
          description: >-
            What the shopper must do next (e.g. ship the items back). Present
            once the

            return is approved — i.e. on `requires_action`, `processing`, and

            `refunded` — and may be present on `denied` / `failed` if they were

            approved before terminating. Absent on `requested`.
        timeline:
          $ref: '#/components/schemas/ReturnTimeline'
          description: >-
            Per-transition timestamps; later stamps fill in as the Return
            advances.
        reason:
          $ref: '#/components/schemas/ReturnReason'
          description: Reason the return was requested, echoed back from the create call.
        checkoutIntentId:
          type: string
          description: Rye checkout intent id that produced the order being returned.
        orderId:
          type: string
          description: Rye order id (`order_<32 hex>`) this Return was opened against.
        state:
          $ref: '#/components/schemas/ReturnState'
          description: >-
            Lifecycle state; the discriminator for the optional sub-objects
            below.
        id:
          type: string
          description: Rye return id (`ret_<32 hex>`).
      required:
        - updatedAt
        - createdAt
        - timeline
        - reason
        - checkoutIntentId
        - orderId
        - state
        - id
      type: object
      description: >-
        A single Return record. The `state` discriminator tells you which of

        `denial`, `failure`, and `refunds` is populated; `nextAction` is set
        once the

        Return is approved (see {@link NextActionResponse}).
    ReturnPostParams:
      properties:
        reason:
          $ref: '#/components/schemas/ReturnReason'
          description: Reason for the return.
        orderId:
          type: string
          description: Rye order id (`order_<32 hex>`) of the order being returned.
      required:
        - reason
        - orderId
      type: object
      description: |-
        Request body for `POST /api/v1/returns`. Whole-order returns only —
        server enumerates the order's line items at create time.
    AdvanceShipmentResponse:
      properties:
        shipment:
          $ref: '#/components/schemas/Shipment'
      required:
        - shipment
      type: object
    SimulatedReturnLineItem:
      properties:
        quantity:
          type: integer
          format: int32
          description: Units of this line item to return.
          minimum: 1
        orderLineItemId:
          type: string
          description: Order line item id (`oi_<hex>`) to return.
      required:
        - quantity
        - orderLineItemId
      type: object
    CreateSimulatedReturnRequest:
      properties:
        lineItems:
          items:
            $ref: '#/components/schemas/SimulatedReturnLineItem'
          type: array
          description: >-
            Subset of order line items to return. Defaults to every order item
            at full quantity.
        reason:
          $ref: '#/components/schemas/ReturnReason'
          description: Defaults to `other` when omitted.
        orderId:
          type: string
          description: >-
            Rye order id (`oi_<hex>` / `order_<hex>`) to open the simulated
            return against.
      required:
        - orderId
      type: object
    ApproveReturnRequest:
      properties:
        nextAction:
          $ref: '#/components/schemas/NextActionType'
          description: >-
            `ship_items_to_merchant` lands the return in `requires_action` with
            a stub

            shipping label; `no_action_required` lands it directly in
            `processing`.

            Defaults to `ship_items_to_merchant`.
      type: object
    DenyReturnRequest:
      properties:
        note:
          type: string
        reason:
          $ref: '#/components/schemas/ReturnDeclineReason'
          description: Defaults to `other`.
      type: object
    CostBearer:
      type: string
      enum:
        - shopper
        - developer
        - rye
      description: >-
        Who absorbs the merchant-retained shortfall `S` on a return — the gap

        between what the merchant was charged and what it refunded (restocking
        fees,

        return shipping, partials). Selected per-developer via the

        `refundCostBearingStrategy` flag and resolved into this enum by the

        durable-workers cost-policy adapter.


        - `shopper` (default): the shopper eats `S`. Both anchors reconstruct
        from
          the merchant refund, so a short merchant refund shrinks the shopper refund
          and developer credit in lockstep.
        - `developer`: the shopper is made whole at the original charge `C`; the
          developer's deposit is credited only what Rye recovered (the merchant
          anchor), so the developer absorbs `S`.
        - `rye`: the shopper is made whole at `C` and the developer's full
        drawdown
          debit `D` is restored, so Rye absorbs `S`.
    RefundReturnRequest:
      properties:
        costBearer:
          $ref: '#/components/schemas/CostBearer'
          description: Defaults to `shopper`.
      type: object
    FailReturnRequest:
      properties:
        note:
          type: string
      type: object
  securitySchemes:
    bearerAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Rye API key
info:
  title: Universal Checkout API
  version: 1.0.5
  description: >-
    Turn any product URL into a completed checkout. Instantly retrieve price,
    tax, and shipping for any product, and let users buy without ever leaving
    your native AI experience.


    View the [Rye API docs](https://docs.rye.com).
  termsOfService: https://rye.com/terms-of-service
  license:
    name: UNLICENSED
  contact:
    name: Rye
    email: dev@rye.com
    url: https://docs.rye.com
paths:
  /api/v1/billing/balance:
    get:
      operationId: GetBalance
      responses:
        '200':
          description: Balance in smallest currency unit and currency code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceResponse'
        '401':
          description: Authentication Failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateError'
      description: Get current drawdown balance for the authenticated developer
      summary: Get drawdown balance
      tags:
        - Billing
      security:
        - bearerAuth:
            - billing:read
      parameters: []
      x-codeSamples:
        - lang: JavaScript
          source: |-
            import CheckoutIntents from 'checkout-intents';

            const client = new CheckoutIntents({
              apiKey: process.env['CHECKOUT_INTENTS_API_KEY'], // This is the default and can be omitted
            });

            const response = await client.billing.getBalance();

            console.log(response.balance);
        - lang: Python
          source: |-
            import os
            from checkout_intents import CheckoutIntents

            client = CheckoutIntents(
                api_key=os.environ.get("CHECKOUT_INTENTS_API_KEY"),  # This is the default and can be omitted
            )
            response = client.billing.get_balance()
            print(response.balance)
        - lang: Java
          source: |-
            package com.rye.example;

            import com.rye.client.CheckoutIntentsClient;
            import com.rye.client.okhttp.CheckoutIntentsOkHttpClient;
            import com.rye.models.billing.BillingGetBalanceParams;
            import com.rye.models.billing.BillingGetBalanceResponse;

            public final class Main {
                private Main() {}

                public static void main(String[] args) {
                    CheckoutIntentsClient client = CheckoutIntentsOkHttpClient.fromEnv();

                    BillingGetBalanceResponse response = client.billing().getBalance();
                }
            }
        - lang: cURL
          source: |-
            curl https://staging.api.rye.com/api/v1/billing/balance \
                -H "Authorization: Bearer $CHECKOUT_INTENTS_API_KEY"
  /api/v1/billing:
    get:
      operationId: GetSettings
      responses:
        '200':
          description: Billing configuration including drawdown settings and balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingResponse'
        '401':
          description: Authentication Failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateError'
      description: Get billing configuration and balance for the authenticated developer
      summary: Get billing info
      tags:
        - Billing
      security:
        - bearerAuth:
            - billing:read
      parameters: []
  /api/v1/billing/drawdown:
    post:
      operationId: SetupDrawdown
      responses:
        '200':
          description: Updated billing configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingResponse'
        '401':
          description: Authentication Failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateError'
      description: Set up or update drawdown billing for the authenticated developer
      summary: Setup drawdown billing
      tags:
        - Billing
      security:
        - bearerAuth:
            - billing:write
      parameters: []
      requestBody:
        description: Drawdown settings to configure
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupDrawdownParams'
              description: ''
  /api/v1/billing/drawdown/topup:
    post:
      operationId: CreateTopUpInvoice
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '400':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  message:
                    type: string
                required:
                  - message
                type: object
        '401':
          description: Authentication Failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '409':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  invoice:
                    anyOf:
                      - $ref: '#/components/schemas/Invoice'
                      - $ref: '#/components/schemas/DuplicateInvoice'
                    nullable: true
                  message:
                    type: string
                required:
                  - invoice
                  - message
                type: object
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateError'
        '503':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  message:
                    type: string
                required:
                  - message
                type: object
      description: |-
        Request an on-demand top-up invoice..
        Requires drawdown billing to be enabled. Only one unpaid top-up invoice
        is allowed at a time.
      summary: Create on-demand top-up invoice
      tags:
        - Billing
      security:
        - bearerAuth:
            - billing:write
      parameters: []
      requestBody:
        description: Top-up parameters
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTopUpParams'
              description: ''
      x-codeSamples:
        - lang: JavaScript
          source: >-
            import CheckoutIntents from 'checkout-intents';


            const client = new CheckoutIntents({
              apiKey: process.env['CHECKOUT_INTENTS_API_KEY'], // This is the default and can be omitted
            });


            const response = await client.billing.createTopupInvoice({
            amountSubunits: 500000 });


            console.log(response.id);
        - lang: Python
          source: |-
            import os
            from checkout_intents import CheckoutIntents

            client = CheckoutIntents(
                api_key=os.environ.get("CHECKOUT_INTENTS_API_KEY"),  # This is the default and can be omitted
            )
            response = client.billing.create_topup_invoice(
                amount_subunits=500000,
            )
            print(response.id)
        - lang: Java
          source: |-
            package com.rye.example;

            import com.rye.client.CheckoutIntentsClient;
            import com.rye.client.okhttp.CheckoutIntentsOkHttpClient;
            import com.rye.models.billing.BillingCreateTopupInvoiceParams;
            import com.rye.models.billing.BillingCreateTopupInvoiceResponse;

            public final class Main {
                private Main() {}

                public static void main(String[] args) {
                    CheckoutIntentsClient client = CheckoutIntentsOkHttpClient.fromEnv();

                    BillingCreateTopupInvoiceParams params = BillingCreateTopupInvoiceParams.builder()
                        .amountSubunits(500000)
                        .build();
                    BillingCreateTopupInvoiceResponse response = client.billing().createTopupInvoice(params);
                }
            }
        - lang: cURL
          source: |-
            curl https://staging.api.rye.com/api/v1/billing/drawdown/topup \
                -H 'Content-Type: application/json' \
                -H "Authorization: Bearer $CHECKOUT_INTENTS_API_KEY" \
                -d '{
                      "amountSubunits": 500000,
                      "chargeAutomatically": false
                    }'
  /api/v1/billing/drawdown/topup/{invoiceId}:
    delete:
      operationId: CancelTopUpInvoice
      responses:
        '204':
          description: No Content
        '400':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  message:
                    type: string
                required:
                  - message
                type: object
        '401':
          description: Authentication Failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '404':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  message:
                    type: string
                required:
                  - message
                type: object
        '409':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  status:
                    type: string
                  invoiceId:
                    type: string
                  message:
                    type: string
                required:
                  - status
                  - invoiceId
                  - message
                type: object
      description: |-
        Cancel/void an unpaid top-up invoice.
        Only invoices in open state can be cancelled.
      summary: Cancel top-up invoice
      tags:
        - Billing
      security:
        - bearerAuth:
            - billing:write
      parameters:
        - description: The Stripe invoice ID to cancel
          in: path
          name: invoiceId
          required: true
          schema:
            type: string
      x-codeSamples:
        - lang: JavaScript
          source: |-
            import CheckoutIntents from 'checkout-intents';

            const client = new CheckoutIntents({
              apiKey: process.env['CHECKOUT_INTENTS_API_KEY'], // This is the default and can be omitted
            });

            await client.billing.cancelTopupInvoice('invoiceId');
        - lang: Python
          source: |-
            import os
            from checkout_intents import CheckoutIntents

            client = CheckoutIntents(
                api_key=os.environ.get("CHECKOUT_INTENTS_API_KEY"),  # This is the default and can be omitted
            )
            client.billing.cancel_topup_invoice(
                "invoiceId",
            )
        - lang: Java
          source: |-
            package com.rye.example;

            import com.rye.client.CheckoutIntentsClient;
            import com.rye.client.okhttp.CheckoutIntentsOkHttpClient;
            import com.rye.models.billing.BillingCancelTopupInvoiceParams;

            public final class Main {
                private Main() {}

                public static void main(String[] args) {
                    CheckoutIntentsClient client = CheckoutIntentsOkHttpClient.fromEnv();

                    client.billing().cancelTopupInvoice("invoiceId");
                }
            }
        - lang: cURL
          source: >-
            curl
            https://staging.api.rye.com/api/v1/billing/drawdown/topup/$INVOICE_ID
            \
                -X DELETE \
                -H "Authorization: Bearer $CHECKOUT_INTENTS_API_KEY"
  /api/v1/billing/transactions:
    get:
      operationId: ListTransactions
      responses:
        '200':
          description: Paginated list of balance transactions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionsResponse'
        '401':
          description: Authentication Failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateError'
      description: List drawdown balance transactions for the authenticated developer
      summary: List drawdown transactions
      tags:
        - Billing
      security:
        - bearerAuth:
            - billing:read
      parameters:
        - description: Maximum number of transactions to return (default 20)
          in: query
          name: limit
          required: false
          schema:
            default: 20
            format: int32
            type: integer
            minimum: 1
            maximum: 100
        - description: Cursor for forward pagination (transaction ID to start after)
          in: query
          name: after
          required: false
          schema:
            type: string
        - description: Cursor for backward pagination (transaction ID to end before)
          in: query
          name: before
          required: false
          schema:
            type: string
      x-codeSamples:
        - lang: JavaScript
          source: >-
            import CheckoutIntents from 'checkout-intents';


            const client = new CheckoutIntents({
              apiKey: process.env['CHECKOUT_INTENTS_API_KEY'], // This is the default and can be omitted
            });


            // Automatically fetches more pages as needed.

            for await (const billingListTransactionsResponse of
            client.billing.listTransactions()) {
              console.log(billingListTransactionsResponse.id);
            }
