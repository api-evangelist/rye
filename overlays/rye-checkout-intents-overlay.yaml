overlay: 1.0.0
info:
  title: API Evangelist enhancements for Rye Universal Checkout API
  version: 1.0.0
extends: openapi/rye-checkout-intents-openapi-original.yml
actions:
  - target: $.info
    update:
      x-apievangelist-provider: rye
      x-apievangelist-enriched: '2026-07-21'
      x-apievangelist-artifacts:
        - authentication/rye-authentication.yml
        - conventions/rye-conventions.yml
        - errors/rye-problem-types.yml
        - errors/rye-decline-codes.yml
        - lifecycle/rye-lifecycle.yml
        - sandbox/rye-sandbox.yml
        - asyncapi/rye-webhooks.yml
        - data-model/rye-data-model.yml
  - target: $.servers
    update:
      - url: https://api.rye.com
        description: Production (added by API Evangelist - the published spec only ships the staging server)
      - url: https://staging.api.rye.com
        description: Staging / sandbox
